server {
    listen 80;
    server_name dashboard.your-domain.com;

    root /var/www/noon-dairy-dashboard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: browser cache for built assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
